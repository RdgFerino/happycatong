<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja um colaborador - HAPPYCATONG</title>

    <link rel="stylesheet" href="css/style.css">
    

</head>

<body>
    <header>

    <h1>HAPPYCATONG</h1>

    <nav>
        <a href="index.html">Início</a>
        <a href="projetos.html">Projetos</a>
        <a href="cadastro.html">Seja um colaborador</a>
    </nav>
    <main>
        <section class="intro-cadastro">
            <h2>Seja um colaborador</h2>
            <p>Ajude-nos a salvar mais gatinhos! Preencha o formulário abaixo para se tornar um voluntário ou doador.</p>
        </section>
        <section class="secao-formulario">
            <form>
                <fieldset>
                    <legend>Dados Pessoais</legend>
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required>
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>

                </fieldset>
                <fieldset>
                    <legend>Contato</legend>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15" required>
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" placeholder="00000-000" maxlength="9" required>
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required>
                </fieldset>
                <fieldset>
                    <legend>Interesse</legend>
                    <label for="interesse">Como você deseja ajudar?</label>
                        <div class="opcoes-ajuda">
                            <div>
                                <input type="radio" id="doacao" name="forma-ajuda" value="doacao" required>
                                <label for="doacao">Doação</label>
                            </div>
                            <div>
                                <input type="radio" id="adocao" name="forma-ajuda" value="adocao" required>
                                <label for="adocao">Adoção</label>
                            </div>
                            <div>
                                <input type="radio" id="voluntariado" name="forma-ajuda" value="voluntariado" required>
                                <label for="voluntariado">Voluntariado</label>
                            </div>
                            <div>
                                <input type="radio" id="lar-temporario" name="forma-ajuda" value="lar-temporario" required>
                                <label for="lar-temporario">Lar Temporário</label>
                            </div>
                        </div>
                    <label for="mensagem">Como gostaria de ajudar? (opcional):</label>
                    <textarea id="mensagem" name="mensagem" rows="4" cols="50" placeholder="Digite sua mensagem aqui..."></textarea>
                        <div class="aceite">
                            <input type="checkbox" id="termos" name="termos" required>
                            <label for="termos">Aceito receber informações sobre oportunidades de ajuda.</label>
                        </div>
                    <button type="submit" class="botao">Enviar</button>
                </fieldset>
            </form>
        </section>

    </main>
    <footer>

    <p>&copy; 2026 HAPPYCATONG - Proteção Animal</p>

</footer>

</header>

</body>

</html>
